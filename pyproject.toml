[tool.poetry]
name = "1d-pemfc-model"
version = "0.3.0"
description = "A 1D steady-state, non-isothermal, two-phase PEM fuel cell model in Python."
authors = ["Victor Constantin Cartsounis <victor@example.com>"]
readme = "README.md"
license = "BSD-3-Clause"
packages = [{ include = "pemfc_1d" }]

[tool.poetry.dependencies]
python = "^3.9"
numpy = ">=1.24"
scipy = ">=1.10"
matplotlib = ">=3.7"
sympy = "^1.14.0"

[tool.poetry.group.dev.dependencies]
pytest = ">=7.0"

# Analysis notebooks only (notebooks/analysis_sensitivity.ipynb). Marked
# python >=3.11 rather than widening the package's own "^3.9": the model
# itself still runs on 3.9, and nothing in pemfc_1d imports these.
pandas = { version = ">=2.2", python = ">=3.11" }
jupyter = { version = ">=1.1", python = ">=3.11" }
ipykernel = { version = ">=6.29", python = ">=3.11" }
tabulate = { version = ">=0.9", python = ">=3.11" }

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"
